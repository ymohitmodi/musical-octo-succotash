[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hedgefund"
version = "0.1.0"
description = "Autonomous multi-agent deep-value research & paper-trading system (dark factory, constitutional AI, evolving agents) powered by Ollama cloud models and free data sources."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2.0"]

[project.scripts]
hedgefund = "hedgefund.main:main"

[tool.setuptools.packages.find]
include = ["hedgefund*"]
