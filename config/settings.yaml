# Runtime settings. Environment variables in ${VAR} form are expanded;
# ${VAR:default} supplies a default when the variable is unset.

fund:
  capital_usd: ${FUND_CAPITAL_USD:1500000}
  benchmark: SPY
  timezone: ${FUND_TIMEZONE:America/New_York}

llm:
  host: ${OLLAMA_HOST:http://localhost:11434}
  api_key: ${OLLAMA_API_KEY:}
  # HEAVY chain: strongest first — used for committee analyses, PM decisions,
  # checklist, pre-mortem, constitutional critique (the calls that move money).
  models: ${OLLAMA_MODELS:deepseek-v3.1:671b-cloud,gpt-oss:120b-cloud,qwen3:32b,llama3.1:8b}
  # LIGHT chain: cheap models for routine work — position reviews, macro
  # refresh, post-mortems. Ollama cloud meters GPU time by model weight
  # (usage levels 1-4), so tiering stretches a Pro plan across 24/7 operation.
  light_models: ${OLLAMA_LIGHT_MODELS:gpt-oss:20b-cloud,qwen3:8b,llama3.1:8b}
  # Daily budget in units (heavy call = 3, light = 1). Sized so a normal day
  # (1 research cycle ≈ 8 heavy calls = 24u, monitors ≈ 20u) uses well under
  # half, leaving headroom for weekend rescans. 0 = unlimited (self-hosted).
  daily_budget_units: 400
  # Committee model diversity: different models per agent breaks single-model
  # groupthink (correlated blind spots). Each agent tries its model first,
  # then falls back down the heavy chain. Leave blank to use the chain.
  agent_models:
    fundamental: ${MODEL_FUNDAMENTAL:}
    forensic: ${MODEL_FORENSIC:}
    moat: ${MODEL_MOAT:}
    bear: ${MODEL_BEAR:gpt-oss:120b-cloud}     # the dissenter thinks differently
    pm: ${MODEL_PM:}
  # Semantic memory (optional): an Ollama embedding model (embeddinggemma,
  # nomic-embed-text) lets agents retrieve the lessons most RELEVANT to the
  # current analysis instead of merely the most recent. Blank = recency mode.
  embed_model: ${OLLAMA_EMBED_MODEL:}
  request_timeout_sec: 240
  max_retries: 3

data:
  edgar_user_agent: ${EDGAR_USER_AGENT:DeepValueFund research bot change-me@example.com}
  fred_api_key: ${FRED_API_KEY:}
  cache_dir: data
  # polite rate limits for free sources (requests/second)
  edgar_rps: 5
  market_rps: 2

pipeline:
  # How many screener survivors get the full multi-agent deep-dive per cycle.
  deep_dive_batch: 4
  # Minimum composite conviction (0-100) required to reach the PM.
  min_conviction: 65
  # Paper broker friction model
  slippage_bps: 10
  commission_per_trade: 0.0

schedule:
  # All times are fund-timezone (default America/New_York). The orchestrator
  # runs 24/7; these define what it does in each window.
  premarket_screen: "07:30"      # refresh universe screen daily
  market_open: "09:30"
  market_close: "16:00"
  intraday_monitor_minutes: 20   # position/risk checks cadence while open
  evening_deepdive: "18:00"      # multi-agent analysis of top candidates
  nightly_evolution: "01:30"     # genome evolution + daily report
  weekend_full_rescan: "10:00"   # Saturday: full universe rescan + self-audit
  # 24/7 exploration: outside market hours, the Prospector runs one idea-
  # sourcing channel (52w-lows, net-nets, crash-with-quality, insider
  # clusters, spinoffs) every N hours, rotating through all channels.
  exploration_hours_between: 2

evolution:
  enabled: true
  population_per_agent: 4
  min_closed_decisions_for_fitness: 5
  mutation_rate: 0.35
  elite_keep: 1
