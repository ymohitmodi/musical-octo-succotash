# The investable universe. Two modes, combined:
#   seeds:  always screened
#   auto_expand: when true, the screener also samples the full SEC ticker file
#               (company_tickers.json) each weekend, filtered by the
#               constitution's market-cap and liquidity floors.
auto_expand: true
auto_expand_sample: 150          # tickers sampled from SEC list per weekend scan

# Sector labels are used for the constitution's sector-concentration limit.
seeds:
