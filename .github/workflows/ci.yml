name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    # The fund is developed on Windows 11; prove the offline suite also passes on
    # Linux and macOS. No network, no LLM, no brokerage -- tests use fakes.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install requests PyYAML
      - name: Unit + end-to-end tests (offline)
        run: python -m unittest discover tests
